<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Прогноз горизонтов (AR(1))</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding-top: 8px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .scroll-wrapper {
      width: 100vw;
      overflow-x: scroll;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      background: #111;
    }

    canvas {
      width: 2200px;
      height: 500px;
      background: #fff;
      margin: 0 auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    .hint {
      font-size: 14px;
      color: #ccc;
      text-align: center;
      padding: 6px 16px 4px 16px;
      min-height: 40px;
    }

    .slider-wrapper {
      width: 100vw;
      padding: 0 16px 8px 16px;
      box-sizing: border-box;
    }

    input[type="range"] { width: 100%; }

    .actions { padding-bottom: 10px; display: flex; gap: 10px; }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #3498db;
      color: #fff;
      opacity: 0.4;
    }
    .btn.enabled { opacity: 1; }

    #progressBar {
      width: 90vw;
      max-width: 600px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    #progressFill {
      height: 100%;
      background: #2ecc71;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #roundLabel {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 4px;
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.setHeaderColor("dark");
    Telegram.WebApp.setBackgroundColor("#111");
  </script>
</head>
<body>

  <div id="controls" style="
      position: fixed; top: 10%; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: row; gap: 10px;">
    <button id="fullscreenBtn" style="width:140px;padding:10px 0;font-size:15px;background:#3498db;color:white;border:1px solid #fff;border-radius:6px;cursor:pointer;">Полный экран</button>
    <button id="normalBtn"     style="width:140px;padding:10px 0;font-size:15px;background:#3498db;color:white;border:1px solid #fff;border-radius:6px;cursor:pointer;">Свернуть</button>
  </div>
  <script>
    document.getElementById("fullscreenBtn").onclick = () => Telegram.WebApp.requestFullscreen();
    document.getElementById("normalBtn").onclick     = () => Telegram.WebApp.exitFullscreen();
  </script>

  <div id="roundLabel">Раунд 1 из 5</div>
  <div id="progressBar"><div id="progressFill" style="width:0%"></div></div>

  <div class="scroll-wrapper" id="scrollWrapper">
    <canvas id="plot"></canvas>
  </div>

  <div class="hint" id="status">
    Пролистай вправо и кликни в зелёной полосе горизонта h=1 для первого прогноза.
  </div>

  <div class="slider-wrapper">
    <input type="range" id="scrollSlider" min="0" max="100" value="0">
  </div>

  <div class="actions">
    <button id="sendBtn" class="btn" disabled>Отправить результаты</button>
  </div>

<script>
/***  ПАРАМЕТРЫ  ***/
const urlParams = new URLSearchParams(window.location.search);
const phi         = parseFloat(urlParams.get("phi"))         || 0.5;
const TOTAL_ROUNDS = 5;
const HORIZONS     = [1, 2, 3, 6, 9, 12];   // горизонты прогноза
const BASE_N       = 100;                     // длина истории
const HISTORY_LEN  = BASE_N;                 // видимая история (не меняется между раундами)
// Сколько точек нужно вперёд от BASE_N: max горизонт = 12
const FUTURE_LEN   = Math.max(...HORIZONS);
const TOTAL_N      = BASE_N + FUTURE_LEN;    // всего точек в ряду

/***  ГЕНЕРАЦИЯ AR(1)  ***/
function randn() {
  const u = 1 - Math.random(), v = 1 - Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function generateAR1(n, phi, sigma=0.5) {
  const X = [sigma * randn()];
  for (let t = 1; t < n; t++) X.push(phi * X[t-1] + sigma * randn());
  return X;
}

/***  СОСТОЯНИЕ  ***/
let allRoundData = [];  // данные для каждого раунда (массив массивов)
let allPredictions = []; // все прогнозы всех раундов

let currentRound   = 0; // 0..TOTAL_ROUNDS-1
let currentHorizonIdx = 0; // какой горизонт сейчас (0..5)
// phase: "predicting" | "revealing"
let phase          = "predicting";

// Для текущего раунда
function currentData() { return allRoundData[currentRound]; }
function currentHorizon() { return HORIZONS[currentHorizonIdx]; }
function targetIndex() { return BASE_N - 1 + currentHorizon(); }

// Прогнозы текущего раунда
let roundPredictions = []; // {horizon, t, y_pred, y_true}

// Инициализируем данные для всех раундов сразу
for (let r = 0; r < TOTAL_ROUNDS; r++) {
  allRoundData.push(generateAR1(TOTAL_N, phi));
}

/***  CANVAS  ***/
const canvas = document.getElementById("plot");
const ctx    = canvas.getContext("2d");
canvas.width  = 2200;
canvas.height = 500;
const pad = 40, W = canvas.width - 2*pad, H = canvas.height - 2*pad;

function getMinMax(data) {
  let mn = Infinity, mx = -Infinity;
  for (const v of data) { if (v < mn) mn = v; if (v > mx) mx = v; }
  return [mn, mx];
}

function yScaleFor(minVal, maxVal) {
  return v => {
    if (maxVal === minVal) return canvas.height / 2;
    return pad + H * (1 - (v - minVal) / (maxVal - minVal));
  };
}
function invYScaleFor(minVal, maxVal) {
  return y => {
    const ratio = (y - pad) / H;
    const c = Math.min(1, Math.max(0, ratio));
    return minVal + (1 - c) * (maxVal - minVal);
  };
}
function xCoord(i) { return pad + W * (i / TOTAL_N); }

/***  ОТРИСОВКА  ***/
function drawSeries() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const data = currentData();
  const [minVal, maxVal] = getMinMax(data);
  const yScale    = yScaleFor(minVal, maxVal);
  const invYScale = invYScaleFor(minVal, maxVal);

  // Ось X
  ctx.strokeStyle = "#ccc"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, canvas.height - pad);
  ctx.lineTo(canvas.width - pad, canvas.height - pad);
  ctx.stroke();

  // Сетка по X
  ctx.strokeStyle = "rgba(200,200,200,0.12)"; ctx.lineWidth = 1;
  for (let i = 0; i <= TOTAL_N; i++) {
    const x = xCoord(i);
    ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, canvas.height - pad); ctx.stroke();
  }

  // Реальный ряд — история (0..BASE_N-1)
  ctx.strokeStyle = "#4b6cff"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < BASE_N; i++) {
    const x = xCoord(i), y = yScale(data[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Если фаза "revealing" — показать реальный будущий ряд (BASE_N..TOTAL_N-1)
  if (phase === "revealing") {
    ctx.strokeStyle = "#4b6cff"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath();
    for (let i = BASE_N - 1; i < TOTAL_N; i++) {
      const x = xCoord(i), y = yScale(data[i]);
      if (i === BASE_N - 1) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.setLineDash([]);

    // Точки истинных значений на горизонтах
    for (const h of HORIZONS) {
      const ti = BASE_N - 1 + h;
      const x = xCoord(ti), y = yScale(data[ti]);
      ctx.fillStyle = "#4b6cff";
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.font = "11px system-ui";
      ctx.fillText(`h=${h}`, x + 6, y - 8);
    }
  }

  // Зоны прогнозов (в фазе предсказания)
  if (phase === "predicting") {
    // Тусклые зоны для уже сделанных горизонтов
    for (let hi = 0; hi < currentHorizonIdx; hi++) {
      const h = HORIZONS[hi];
      const xT = xCoord(BASE_N - 1 + h);
      ctx.fillStyle = "rgba(46,204,113,0.04)";
      ctx.fillRect(xT - 25, pad, 50, H);
    }

    // Активная зона
    const xT = xCoord(targetIndex());
    ctx.fillStyle = "rgba(46,204,113,0.10)";
    ctx.fillRect(xT - 30, pad, 60, H);

    ctx.strokeStyle = "#2ecc71"; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(xT, pad); ctx.lineTo(xT, canvas.height - pad); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#000"; ctx.font = "13px system-ui";
    ctx.fillText(`← h = ${currentHorizon()}`, xT + 4, pad + 20);

    // Метки будущих горизонтов (тусклые)
    for (let hi = currentHorizonIdx + 1; hi < HORIZONS.length; hi++) {
      const h = HORIZONS[hi];
      const x = xCoord(BASE_N - 1 + h);
      ctx.strokeStyle = "rgba(46,204,113,0.25)"; ctx.setLineDash([4,8]);
      ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, canvas.height - pad); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#666"; ctx.font = "12px system-ui";
      ctx.fillText(`h=${h}`, x + 3, pad + 20);
    }
  }

  // Прогнозные крестики текущего раунда
  for (let hi = 0; hi < roundPredictions.length; hi++) {
    const p = roundPredictions[hi];
    const x = xCoord(p.t), y = yScale(p.y_pred);
    ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 2;
    const sz = 7;
    ctx.beginPath();
    ctx.moveTo(x-sz, y-sz); ctx.lineTo(x+sz, y+sz);
    ctx.moveTo(x-sz, y+sz); ctx.lineTo(x+sz, y-sz);
    ctx.stroke();
    ctx.fillStyle = "#e67e22"; ctx.font = "12px system-ui";
    ctx.fillText(`h=${HORIZONS[hi]}`, x + 8, y - 8);

    // В фазе reveal — нарисовать линию к истинному значению
    if (phase === "revealing") {
      const yT = yScale(p.y_true);
      const xP = x;
      ctx.strokeStyle = "rgba(231,76,60,0.6)"; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(xP, y); ctx.lineTo(xP, yT); ctx.stroke();
      ctx.setLineDash([]);
      // Ошибка
      const err = (p.y_pred - p.y_true).toFixed(2);
      ctx.fillStyle = "#e74c3c"; ctx.font = "11px system-ui";
      ctx.fillText(`err=${err}`, xP + 8, (y + yT) / 2);
    }
  }

  // Подписи
  ctx.fillStyle = "#000"; ctx.font = "18px system-ui";
  ctx.fillText(`AR(1), φ=${phi.toFixed(2)}  |  Раунд ${currentRound+1}/${TOTAL_ROUNDS}`, pad, pad - 10);

  if (phase === "predicting") {
    ctx.fillStyle = "#1a8a4a"; ctx.font = "14px system-ui";
    ctx.fillText(`Прогнозов сделано: ${roundPredictions.length} / ${HORIZONS.length}  (следующий горизонт h=${currentHorizon()})`, pad, canvas.height - pad + 28);
  } else {
    ctx.fillStyle = "#e74c3c"; ctx.font = "14px system-ui";
    ctx.fillText(`Раунд ${currentRound+1} завершён. Нажмите «Следующий раунд» или «Отправить».`, pad, canvas.height - pad + 28);
  }
}

drawSeries();

/***  СКРОЛЛ И СЛАЙДЕР  ***/
const wrapper = document.getElementById("scrollWrapper");
const slider  = document.getElementById("scrollSlider");
const statusDiv = document.getElementById("status");
const sendBtn   = document.getElementById("sendBtn");

slider.addEventListener("input", () => {
  const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
  wrapper.scrollLeft = (slider.value / 100) * maxScroll;
});
wrapper.addEventListener("scroll", () => {
  const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
  if (maxScroll > 0) slider.value = (wrapper.scrollLeft / maxScroll) * 100;
});
setTimeout(() => { slider.value = 100; slider.dispatchEvent(new Event("input")); }, 300);

/***  ПРОГРЕСС  ***/
function updateProgress() {
  const totalPreds = TOTAL_ROUNDS * HORIZONS.length;
  const done       = allPredictions.length + roundPredictions.length;
  document.getElementById("progressFill").style.width = (done / totalPreds * 100) + "%";
  document.getElementById("roundLabel").textContent = `Раунд ${currentRound+1} из ${TOTAL_ROUNDS}`;
}

/***  КЛИК  ***/
canvas.addEventListener("click", function(evt) {
  if (phase !== "predicting") return;

  const rect = canvas.getBoundingClientRect();
  const x = evt.clientX - rect.left;
  const y = evt.clientY - rect.top;

  const data   = currentData();
  const [minVal, maxVal] = getMinMax(data);
  const invYScale = invYScaleFor(minVal, maxVal);

  const xTarget = xCoord(targetIndex());
  const zoneW   = 60;

  if (x < xTarget - zoneW/2 || x > xTarget + zoneW/2) {
    statusDiv.textContent = `Кликни в зелёной полосе для горизонта h=${currentHorizon()}.`;
    return;
  }

  const yPred = invYScale(y);
  const yTrue = data[targetIndex()];

  roundPredictions.push({
    round: currentRound,
    horizon: currentHorizon(),
    t: targetIndex(),
    y_pred: yPred,
    y_true: yTrue
  });

  currentHorizonIdx++;
  updateProgress();

  if (currentHorizonIdx < HORIZONS.length) {
    // Ещё есть горизонты
    statusDiv.textContent =
      `h=${HORIZONS[currentHorizonIdx-1]} ✓ (y̰=${yPred.toFixed(2)}, real=${yTrue.toFixed(2)}). ` +
      `Теперь h=${currentHorizon()} — кликни в следующей полосе.`;
    drawSeries();
  } else {
    // Все горизонты сделаны — reveal
    phase = "revealing";
    drawSeries();
    statusDiv.textContent = "Все горизонты предсказаны! Сравни прогнозы с реальными значениями.";
    showNextOrSend();
  }
});

/***  КНОПКА "СЛЕДУЮЩИЙ РАУНД" ИЛИ "ОТПРАВИТЬ"  ***/
function showNextOrSend() {
  const actionsDiv = document.querySelector(".actions");
  // Удаляем старую кнопку "next" если есть
  const old = document.getElementById("nextBtn");
  if (old) old.remove();

  if (currentRound < TOTAL_ROUNDS - 1) {
    const btn = document.createElement("button");
    btn.id = "nextBtn";
    btn.className = "btn enabled";
    btn.textContent = "Следующий раунд →";
    actionsDiv.insertBefore(btn, sendBtn);
    btn.addEventListener("click", startNextRound);
  } else {
    // Последний раунд — активируем отправку
    sendBtn.disabled = false;
    sendBtn.classList.add("enabled");
  }
}

function startNextRound() {
  // Сохраняем прогнозы текущего раунда
  allPredictions.push(...roundPredictions);
  roundPredictions = [];
  currentRound++;
  currentHorizonIdx = 0;
  phase = "predicting";

  const old = document.getElementById("nextBtn");
  if (old) old.remove();

  updateProgress();
  drawSeries();
  statusDiv.textContent = `Раунд ${currentRound+1}. Кликни в зелёной полосе для h=${currentHorizon()}.`;
}

/***  ОТПРАВКА  ***/
sendBtn.addEventListener("click", function() {
  // Включаем прогнозы последнего раунда
  const finalPreds = [...allPredictions, ...roundPredictions];

  if (finalPreds.length < TOTAL_ROUNDS * HORIZONS.length) {
    statusDiv.textContent = "Сначала заверши все раунды.";
    return;
  }

  const payload = {
    phi,
    base_n: BASE_N,
    total_rounds: TOTAL_ROUNDS,
    horizons: HORIZONS,
    predictions: finalPreds
  };

  Telegram.WebApp.sendData(JSON.stringify(payload));
});

updateProgress();
</script>
</body>
</html>
